<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スキルシミュレーター</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:620px;margin:auto;padding:16px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:#6b7280;margin-top:3px}
.switch{display:flex;background:#e4e7ec;border-radius:12px;padding:3px}
.switch button{border:0;background:transparent;padding:8px 17px;border-radius:9px;font-weight:700}
.switch .on{background:#fff;box-shadow:0 1px 4px #0002}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h2{font-size:18px;margin:0}
.pill{background:#eef2ff;padding:5px 9px;border-radius:99px;font-size:12px}
.skill{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;margin:10px 0}
.searchwrap{position:relative;min-width:0}
.search{display:block;width:100%;min-height:52px;padding:12px;border:1px solid #d5d9df;border-radius:10px;background:#fff;color:#17202a;-webkit-text-fill-color:#17202a;caret-color:#17202a;font-size:16px;line-height:1.4;opacity:1}
.suggestions{display:none;position:absolute;z-index:9999;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #d5d9df;border-radius:10px;box-shadow:0 6px 18px #0002}
.suggestions.show{display:block}
.suggestion{display:block;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #edf0f3;background:#fff;text-align:left;font-size:14px}
.suggestion:last-child{border-bottom:0}
.suggestion:active{background:#eef2ff}
.noresult{padding:12px;color:#6b7280;font-size:13px}
.score{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.total{background:#17202a;color:#fff;border-radius:13px;padding:14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.total small{color:#cbd5e1}.total b{font-size:25px}
.note{font-size:12px;color:#6b7280;line-height:1.5;margin-top:12px}
.reset{width:100%;margin-top:10px;padding:10px;border:1px solid #d5d9df;background:#fff;border-radius:10px;font-weight:600}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid #dfe3e8;padding:10px max(14px,calc((100vw - 620px)/2 + 14px));display:flex;justify-content:space-between;align-items:center}
.sticky small{color:#6b7280}.sticky b{font-size:23px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>スキルシミュレーター</h1><div class="sub">スキルを選択して評価値を確認</div></div>
    <div class="switch">
      <button id="bat" class="on">打者</button>
      <button id="pit">投手</button>
    </div>
  </div>

  <div class="card">
    <div class="cardhead">
      <h2>スキル</h2>
      <span class="pill">最大4個</span>
    </div>
    <div id="skills">
      <div class="skill"><div class="searchwrap"><input class="search" id="search0" type="text" autocomplete="off" placeholder="スキル名を入力（例：エース）"></div><div class="score" id="score0">—</div></div>
      <div class="skill"><div class="searchwrap"><input class="search" id="search1" type="text" autocomplete="off" placeholder="スキル名を入力（例：エース）"></div><div class="score" id="score1">—</div></div>
      <div class="skill"><div class="searchwrap"><input class="search" id="search2" type="text" autocomplete="off" placeholder="スキル名を入力（例：エース）"></div><div class="score" id="score2">—</div></div>
      <div class="skill"><div class="searchwrap"><input class="search" id="search3" type="text" autocomplete="off" placeholder="スキル名を入力（例：エース）"></div><div class="score" id="score3">—</div></div>
    </div>
    <button class="reset" onclick="resetSkills()">すべてクリア</button>
    <div class="note">
      ひらがな・カタカナのどちらでも、スキル名または読みの先頭から検索できます。漢字スキルも登録された読みから検索できます。<br>
      同じスキルを複数選択することはできません。評価点は元の選手評価表と同じです。
    </div>
  </div>

  <div class="total">
    <div><small>スキル評価合計</small></div>
    <b id="total">0</b>
  </div>
</div>

<div class="sticky"><small>現在のスキル評価</small><b id="sticky">0</b></div>

const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');

const score=n=>(master().find(x=>x.name===n)||{score:0}).score;

function render(){
  $("skills").innerHTML=[0,1,2,3].map(i=>`
    <div class="skill">
      <div class="searchwrap">
        <input class="search" id="search${i}" type="text" autocomplete="off"
          placeholder="スキル名を入力（例：エース）" value="${escapeHtml(queries[i])}"
          aria-label="スキル${i+1}を検索">
        <div class="suggestions" id="suggestions${i}"></div>
      </div>
      <div class="score" id="score${i}">${skills[i]?fmt(score(skills[i])):"—"}</div>
    </div>`).join("");
  [0,1,2,3].forEach(i=>showSuggestions(i));
  update();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// モバイルブラウザでも確実に反応するよう、イベントリスナーで検索を処理
$("skills").addEventListener("input", event=>{
  const input=event.target.closest("input.search");
  if(!input) return;
  const i=Number(input.id.replace("search",""));
  // IME変換中のひらがなも、そのまま検索対象にする
  onSearch(i,input.value);
});
$("skills").addEventListener("compositionend", event=>{
  const input=event.target.closest("input.search");
  if(!input) return;
  const i=Number(input.id.replace("search",""));
  onSearch(i,input.value);
});
$("skills").addEventListener("focusin", event=>{
  const input=event.target.closest("input.search");
  if(!input) return;
  const i=Number(input.id.replace("search",""));
  queries[i]=input.value;
  showSuggestions(i);
});
$("skills").addEventListener("click", event=>{
  const button=event.target.closest("button.suggestion");
  if(!button) return;
  event.preventDefault();
  chooseSkill(Number(button.dataset.skillIndex),button.dataset.skillName);
});

function onSearch(i,value){
  queries[i]=value;
  // 入力を始めたら、枠に入っていたスキルはいったん解除
  skills[i]="";
  $("score"+i).textContent="—";
  update();
  showSuggestions(i);
}

// ひらがな・カタカナを同じ読みとして扱う
function normalizeSearch(value){
  return String(value||"").normalize("NFKC").toLocaleLowerCase()
    .replace(/[\u3041-\u3096]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) + 0x60)
    );
}

function showSuggestions(i){
  const box=$("suggestions"+i);
  if(!box) return;
  const input=$("search"+i);
  const rawQ=((input ? input.value : queries[i])||"").trim();
  const q=normalizeSearch(rawQ);
  queries[i]=rawQ;
  const alreadyUsed=skills.filter((x,j)=>j!==i && x);
  let candidates=master().filter(s=>{
    const name=normalizeSearch(s.name);
    const reading=normalizeSearch(skillReadings[s.name]||"");
    return !alreadyUsed.includes(s.name) &&
      (!q || name.startsWith(q) || (reading && reading.startsWith(q)));
  });
  // 入力前は候補を出さず、入力後は冒頭一致の候補だけを表示
  if(!q){
    box.innerHTML="";
    box.classList.remove("show");
    return;
  }
  // 候補数を制限せず、該当するスキルをすべて表示（リスト内はスクロール可能）
  if(candidates.length){
    box.innerHTML=candidates.map(s=>
      `<button type="button" class="suggestion" data-skill-index="${i}" data-skill-name="${escapeHtml(s.name)}">${escapeHtml(s.name)} <span style="float:right;color:#6b7280">${fmt(s.score)}</span></button>`
    ).join("");
  }else{
    box.innerHTML='<div class="noresult">一致するスキルがありません</div>';
  }
  box.classList.add("show");
}

function escapeJs(s){
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n");
}

function chooseSkill(i,name){
  if(name && skills.some((x,j)=>j!==i && x===name)){
    alert("同じスキルは2回選べません。");
    return;
  }
  skills[i]=name;
  queries[i]=name;
  render();
}

function setSkill(i,name){
  chooseSkill(i,name);
}
function update(){
  const total=skills.reduce((sum,name)=>sum+score(name),0);
  $("total").textContent=fmt(total);
  $("sticky").textContent=fmt(total);
}

function resetSkills(){
  skills=["","","",""];
  queries=["","","",""];
  render();
}
